name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: an exact version (e.g. 1.2.3) or patch, minor, major'
        required: true
        type: string
      prerelease:
        description: 'Release as pre-release (published under the next dist-tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-npm:
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher configuration.
    environment: main
    permissions:
      contents: write # push the version bump and create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Bump version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git commit -n -a -m "Bumped v$version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$GITHUB_REF"
      # No NPM_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish token and attaches provenance automatically.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ inputs.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --tag "$DIST_TAG"
      - name: Create release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          # Tag the bump commit itself, not whatever the branch points to by now.
          SHA: ${{ steps.bump.outputs.sha }}
          PRERELEASE_FLAG: ${{ inputs.prerelease && '-p' || '' }}
        run: npx @matteo.collina/release-notes -t "v$VERSION" -r prom-client -o platformatic $PRERELEASE_FLAG -c "$SHA"
